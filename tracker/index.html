<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121715" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Job Hunt Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* layout: filter rows on top, one dense table below; rows expand inline into a detail panel. Under 700px rows become cards. */
:root {
  --bg: #f6f7f6; --surface: #ffffff; --fg: #1c2321; --muted: #5d6965; --line: #dde3e0;
  --accent: #1f6f5c; --accent-soft: #e2f0ec;
  --good: #217a3c; --warn: #9a6a00; --bad: #b23a2e;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #121715; --surface: #1a201e; --fg: #e3e9e6; --muted: #93a19c; --line: #2c3532;
  --accent: #5cc3a6; --accent-soft: #1e3530; --good: #6ccf86; --warn: #e0b04a; --bad: #f08273; color-scheme: dark } }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--sans);
  padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(48px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
[hidden] { display: none !important; }
main { max-width: 1100px; margin: 0 auto; display: grid; gap: 12px; min-width: 0; }
h1 { font-size: 22px; font-weight: 600; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 2px 0 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { font: 500 13px var(--sans); border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  border-radius: 999px; padding: 4px 12px; min-height: 32px; cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.chip .n { font-family: var(--mono); opacity: .75; margin-left: 4px; }
.chips-label { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-right: 4px; min-width: 48px; }
button:focus-visible, select:focus-visible, textarea:focus-visible, th:focus-visible, tr:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.notice { color: var(--muted); margin: 0; }
.notice.err { color: var(--bad); }
.sortbar { display: none; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.tablewrap { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); cursor: pointer; user-select: none; white-space: nowrap; }
th[aria-sort="ascending"]::after { content: " \2191"; } th[aria-sort="descending"]::after { content: " \2193"; }
tr.row { cursor: pointer; }
tr.row:hover td { background: var(--accent-soft); }
tr.row.open td { background: var(--accent-soft); border-bottom-color: transparent; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.co { font-weight: 600; }
.role { color: var(--muted); }
.score { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 6px; font: 500 13px var(--mono); background: var(--accent-soft); color: var(--accent); }
.score.s5, .score.s4 { background: var(--accent); color: var(--bg); }
.pay-yes { color: var(--good); } .pay-no { color: var(--bad); } .pay-unknown { color: var(--muted); }
.statuscell { white-space: nowrap; }
.status { font: 500 12px var(--sans); padding: 2px 8px; border-radius: 4px; border: 1px solid var(--line); white-space: nowrap; }
.st-applied, .st-interview, .st-interested { border-color: var(--accent); color: var(--accent); }
.st-offer { background: var(--good); border-color: var(--good); color: var(--bg); }
.st-rejected, .st-dropped { color: var(--muted); text-decoration: line-through; }
.star { font-size: 20px; line-height: 1; background: none; border: 0; padding: 4px 6px 4px 0; min-width: 32px; min-height: 32px; cursor: pointer; color: var(--muted); vertical-align: middle; }
.star.on, .star:hover { color: var(--warn); }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.tech { font: 500 11px var(--mono); color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 0 5px; }
.dropwhy { font-size: 13px; color: var(--bad); margin-top: 2px; }
.flag { font-size: 11px; color: var(--warn); border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; }
td.detail { padding: 4px 12px 16px; }
.detail-grid { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 20px; }
.detail h3 { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 10px 0 4px; }
.detail p { margin: 0; max-width: 65ch; overflow-wrap: anywhere; }
.detail a { color: var(--accent); }
.notes { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.notes li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; }
.notes .num { color: var(--muted); }
textarea, select { font: 16px var(--sans); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-height: 36px; }
textarea { width: 100%; min-height: 64px; resize: vertical; }
.addnote { display: grid; gap: 6px; margin-top: 8px; }
button.primary { justify-self: start; font: 500 14px var(--sans); background: var(--accent); color: var(--bg); border: 0; border-radius: 6px; padding: 8px 16px; min-height: 36px; cursor: pointer; }
button.primary:disabled { opacity: .5; cursor: default; }
.empty { padding: 32px 16px; text-align: center; color: var(--muted); }
.empty code { font-family: var(--mono); color: var(--fg); }

@media (max-width: 700px) {
  body { padding-top: max(16px, env(safe-area-inset-top)); }
  h1 { font-size: 20px; }
  /* one scrollable line per filter row keeps four rows from filling the screen */
  .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; -webkit-overflow-scrolling: touch; }
  .chips::-webkit-scrollbar { display: none; }
  .chips > * { flex-shrink: 0; }
  .chips-label { min-width: 52px; }
  .c-pay { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .sortbar { display: flex; }
  .tablewrap { background: none; border: 0; overflow: visible; }
  table, tbody, tr, td { display: block; }
  thead { display: none; }
  tr.row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; grid-template-areas: "score main status" "score meta meta";
    gap: 2px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  tr.row td { padding: 0; border: 0; background: none !important; }
  tr.row.open { border-color: var(--accent); border-bottom-left-radius: 0; border-bottom-right-radius: 0; margin-bottom: 0; }
  .c-score { grid-area: score; }
  .c-main { grid-area: main; }
  .c-status { grid-area: status; display: flex; align-items: flex-start; gap: 2px; }
  .c-office, .c-pay { grid-column: 2 / 4; font-size: 13px; color: var(--muted); }
  .c-office::before { content: "Office: "; } .c-pay::before { content: "Pay: "; color: var(--muted); }
  .c-found { display: none !important; }
  tr.detailrow { background: var(--surface); border: 1px solid var(--accent); border-top: 0; border-radius: 0 0 8px 8px; margin-bottom: 8px; }
  td.detail { padding: 0 12px 14px; border: 0; }
  .detail-grid { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .empty { background: var(--surface); border-radius: 8px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Job Hunt Board</h1>
    <p class="sub" id="summary">Loading jobs…</p>
  </header>
  <nav class="chips" id="chips" aria-label="Filter by status"></nav>
  <nav class="chips" id="stacks" aria-label="Filter by technology"></nav>
  <nav class="chips" id="modes" aria-label="Filter by office policy"></nav>
  <nav class="chips" id="sources" aria-label="Filter by source"></nav>
  <nav class="chips" id="flags" aria-label="Filter by flag"></nav>
  <label class="sortbar" for="sortsel">Sort
    <select id="sortsel">
      <option value="score">Best score</option>
      <option value="found">Newest</option>
      <option value="company">Company A–Z</option>
    </select>
  </label>
  <p class="notice" id="notice" hidden></p>
  <div class="tablewrap">
    <table>
      <thead><tr id="head"></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>
</main>

<script>
const STATUSES = ["new", "interested", "applied", "interview", "offer", "rejected", "dropped"];
const ACTIVE = ["new", "interested", "applied", "interview", "offer"];
const COLS = [
  { key: "score", label: "Score", cls: "c-score" },
  { key: "company", label: "Company / role", cls: "c-main" },
  { key: "office", label: "Office", cls: "c-office" },
  { key: "pay", label: "Pay", cls: "c-pay" },
  { key: "status", label: "Status", cls: "c-status" },
  { key: "found", label: "Found", cls: "c-found" },
];
const DEFAULT_DIR = { score: -1, found: -1 };

let jobs = [], filter = "active", facets = { stack: "all", mode: "all", source: "all", flag: "all" }, sort = { key: "score", dir: -1 }, openId = null;
const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "class" ? (n.className = v) : n.setAttribute(k, v);
  for (const c of kids) if (c != null) n.append(c);
  return n;
};
const safeUrl = (u) => (/^https?:\/\//i.test(u || "") ? u : null);
const today = () => new Date().toISOString().slice(0, 10);

function notice(text, err) { const n = $("notice"); n.hidden = !text; n.textContent = text || ""; n.classList.toggle("err", !!err); }

const byStatus = (j) => filter === "all" || (filter === "active" ? ACTIVE.includes(j.status) : j.status === filter);
// `office` is free text from /scan; any remote option counts as Remote.
const mode = (j) => {
  const o = (j.office || "").toLowerCase();
  return /remote/.test(o) ? "Remote" : /hybrid/.test(o) ? "Hybrid" : /on-site|onsite|in-office|in office/.test(o) ? "On-site" : "Unknown";
};
const FACETS = [
  { key: "stack", nav: "stacks", label: "Stack", values: (j) => j.stack || [] },
  { key: "mode", nav: "modes", label: "Office", values: (j) => [mode(j)] },
  { key: "source", nav: "sources", label: "Source", values: (j) => [j.source || "?"] },
  { key: "flag", nav: "flags", label: "Flags", values: (j) => ((j.flags || []).length ? j.flags : ["No flags"]) },
];
const byFacets = (j) => FACETS.every((f) => facets[f.key] === "all" || f.values(j).includes(facets[f.key]));

function visible() {
  const list = jobs.filter((j) => byStatus(j) && byFacets(j));
  const { key, dir } = sort;
  return list.sort((a, b) => {
    const x = a[key] ?? "", y = b[key] ?? "";
    if (x === y) return (b.found || "").localeCompare(a.found || "");
    return (typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y))) * dir;
  });
}

function chip(label, n, pressed, onclick) {
  const b = el("button", { class: "chip", "aria-pressed": String(pressed), type: "button" }, label, el("span", { class: "n" }, String(n)));
  b.onclick = onclick;
  return b;
}

function renderChips() {
  const count = (s) => jobs.filter((j) => j.status === s).length;
  const items = [["active", "Active", jobs.filter((j) => ACTIVE.includes(j.status)).length],
    ...STATUSES.map((s) => [s, s[0].toUpperCase() + s.slice(1), count(s)]), ["all", "All", jobs.length]];
  $("chips").replaceChildren(el("span", { class: "chips-label" }, "Status"),
    ...items.map(([k, label, n]) => chip(label, n, filter === k, () => { filter = k; render(); })));
  for (const f of FACETS) {
    const pool = jobs.filter(byStatus), counts = {};
    for (const j of pool) for (const v of f.values(j)) counts[v] = (counts[v] || 0) + 1;
    const vals = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    $(f.nav).hidden = !vals.length;
    $(f.nav).replaceChildren(el("span", { class: "chips-label" }, f.label),
      ...[["all", "Any", pool.length], ...vals.map(([v, n]) => [v, v, n])]
        .map(([k, label, n]) => chip(label, n, facets[f.key] === k, () => { facets[f.key] = k; render(); })));
  }
  const applied = jobs.filter((j) => ["applied", "interview", "offer"].includes(j.status)).length;
  $("summary").textContent = jobs.length
    ? `${jobs.length} jobs tracked · ${count("new")} new to review · ${count("interested")} shortlisted · ${applied} in progress`
    : "No jobs yet.";
}

function setSort(key) {
  sort = { key, dir: sort.key === key ? -sort.dir : (DEFAULT_DIR[key] || 1) };
  $("sortsel").value = key in DEFAULT_DIR || key === "company" ? key : "score";
  render();
}

function renderHead() {
  $("head").replaceChildren(...COLS.map((c) => {
    const th = el("th", { tabindex: "0", scope: "col" }, c.label);
    if (sort.key === c.key) th.setAttribute("aria-sort", sort.dir > 0 ? "ascending" : "descending");
    th.onclick = () => setSort(c.key);
    th.onkeydown = (e) => { if (e.key === "Enter") setSort(c.key); };
    return th;
  }));
}

function starButton(j) {
  if (!["new", "interested"].includes(j.status || "new")) return null;
  const on = j.status === "interested";
  const b = el("button", { class: "star" + (on ? " on" : ""), type: "button", "aria-pressed": String(on),
    "aria-label": on ? "Remove from shortlist" : "Mark interested", title: on ? "Remove from shortlist" : "Mark interested" }, on ? "★" : "☆");
  b.onclick = (e) => { e.stopPropagation(); write(j.id, { status: on ? "new" : "interested" }); };
  b.onkeydown = (e) => e.stopPropagation();
  return b;
}

function detailRow(j) {
  const links = el("p");
  (j.links || []).forEach((u, i) => { const s = safeUrl(u); if (s) { if (i) links.append(" · "); links.append(el("a", { href: s, target: "_blank", rel: "noopener" }, new URL(s).hostname)); } });

  const sel = el("select", { id: "status-" + j.id, "aria-label": "Status" }, ...STATUSES.map((s) => { const o = el("option", { value: s }, s); if (s === j.status) o.selected = true; return o; }));
  sel.onchange = () => write(j.id, { status: sel.value });

  const notes = el("ol", { class: "notes" }, ...(j.notes || []).map((n) => el("li", {}, el("span", { class: "num" }, n.date || ""), el("span", {}, n.text || ""))));
  if (!(j.notes || []).length) notes.append(el("li", { class: "role" }, el("span"), el("span", {}, "No notes yet.")));
  const ta = el("textarea", { id: "note-" + j.id, placeholder: "e.g. Sent CV via LinkedIn; recruiter call Tuesday", "aria-label": "New note" });
  const add = el("button", { class: "primary", type: "button" }, "Add note");
  add.onclick = async () => {
    const text = ta.value.trim(); if (!text) return;
    add.disabled = true;
    if (await write(j.id, { notes: [...(j.notes || []), { date: today(), text }] })) ta.value = "";
    add.disabled = false;
  };

  const left = el("div", {},
    el("h3", {}, "Why"), el("p", {}, j.why || "-"),
    el("h3", {}, "Summary"), el("p", {}, j.summary || "-"),
    el("h3", {}, "Where"), el("p", {}, [j.location, j.source].filter(Boolean).join(" · ") || "-"),
    el("h3", {}, "Links"), links);
  const right = el("div", {},
    el("h3", {}, "Status"), sel,
    el("h3", {}, "Log"), notes,
    el("div", { class: "addnote" }, ta, add));
  return el("tr", { class: "detailrow" }, el("td", { class: "detail", colspan: String(COLS.length) }, el("div", { class: "detail-grid" }, left, right)));
}

function render() {
  renderChips(); renderHead();
  const rows = [];
  const list = visible();
  if (!list.length) {
    rows.push(el("tr", {}, el("td", { colspan: String(COLS.length), class: "empty" },
      jobs.length ? "Nothing in this view." : el("span", {}, "Run ", el("code", {}, "/scan"), " in Claude Code inside the job-hunt repo; new jobs appear here."))));
  }
  for (const j of list) {
    const tr = el("tr", { class: "row" + (openId === j.id ? " open" : ""), tabindex: "0", "aria-expanded": String(openId === j.id) },
      el("td", { class: "c-score" }, el("span", { class: "score s" + (j.score || 0) }, String(j.score ?? "-"))),
      el("td", { class: "c-main" }, el("div", { class: "co" }, j.company || "?"), el("div", { class: "role" }, j.title || ""),
        j.status === "dropped" && j.why ? el("div", { class: "dropwhy" }, "Dropped: " + j.why) : null,
        el("div", { class: "tags" }, ...(j.stack || []).map((s) => el("span", { class: "tech" }, s)), ...(j.flags || []).map((f) => el("span", { class: "flag" }, f)))),
      el("td", { class: "c-office" }, j.office || "unknown"),
      el("td", { class: "c-pay pay-" + (j.pay_ok || "unknown") }, j.pay || "not stated"),
      el("td", { class: "c-status statuscell" }, starButton(j), el("span", { class: "status st-" + j.status }, j.status || "new")),
      el("td", { class: "c-found num" }, j.found || ""));
    const toggle = () => { openId = openId === j.id ? null : j.id; render(); };
    tr.onclick = toggle; tr.onkeydown = (e) => { if (e.key === "Enter") toggle(); };
    rows.push(tr);
    if (openId === j.id) rows.push(detailRow(j));
  }
  $("body").replaceChildren(...rows);
}

async function load() {
  try {
    const r = await fetch("api/jobs", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    jobs = await r.json();
    notice("");
  } catch (e) {
    notice("Can't reach the tracker server. Check that it is running, then reload.", true);
  }
  render();
}

async function write(id, patch) {
  try {
    const r = await fetch("api/jobs/" + encodeURIComponent(id), { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(patch) });
    if (!r.ok) throw new Error((await r.json()).error || r.status);
    const doc = await r.json();
    jobs = jobs.map((j) => (j.id === id ? doc : j));
    notice(""); render(); return true;
  } catch (e) {
    notice("Couldn't save: " + e.message, true); return false;
  }
}

$("sortsel").onchange = (e) => { sort = { key: e.target.value, dir: DEFAULT_DIR[e.target.value] || 1 }; render(); };
// Pick up changes made on another device or by /scan when the tab comes back.
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") load(); });
render();
load();
</script>
</body>
</html>
